# ESP32Klipper sample: CoreXY pen plotter on a BIGTREETECH SKR Pico V1.0
# (stock Klipper RP2040 firmware, UART0 on GPIO0/GPIO1 at 250000 baud).
#
# The pen is lifted by a solenoid driven from the "Laser" header (gpio20)
# through a transistor buffer; M3/M5 switch it like a laser.
#
# This file may be distributed under the terms of the GNU GPLv3 license.

[mcu]
serial: uart:2:27:22    # CYD: UART2 TX=GPIO27, RX=GPIO22
restart_method: command

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 15000
max_z_velocity: 8
square_corner_velocity: 5.0

[stepper_x]
step_pin: gpio11
dir_pin: gpio10
enable_pin: !gpio12
microsteps: 16
rotation_distance: 47.5
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 0
position_max: 110
homing_speed: 40
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
run_current: 0.5
stealthchop_threshold: 999999
diag_pin: ^gpio4
driver_SGTHRS: 30

[stepper_y]
step_pin: gpio6
dir_pin: gpio5
enable_pin: !gpio7
microsteps: 16
rotation_distance: 47.5
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 0
position_max: 160
homing_speed: 40
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
run_current: 0.5
stealthchop_threshold: 999999
diag_pin: ^gpio3
driver_SGTHRS: 32

[stepper_z]
step_pin: gpio19
dir_pin: gpio28
enable_pin: !gpio2
microsteps: 16
rotation_distance: 8
endstop_pin: ^!gpio25
position_endstop: 0
position_min: -5
position_max: 120
homing_speed: 12

[tmc2209 stepper_z]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1
run_current: 0.5
stealthchop_threshold: 999999

# Pen solenoid on the Laser header
[pwm_tool LASER]
pin: gpio20
shutdown_value: 0

# Printing from storage and the Mainsail controls
[virtual_sdcard]
path: ~/printer_data/gcodes

[pause_resume]

[display_status]

[gcode_macro CANCEL_PRINT]
description: Cancel the print and lift the pen
rename_existing: CANCEL_PRINT_BASE
gcode:
    SET_PIN PIN=LASER VALUE=0
    CANCEL_PRINT_BASE

